services:
  nginx:
    image: nginx:alpine
    container_name: greenkong-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - traefik_public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.res-chino.rule=PathPrefix(`/res-chino`)"
      - "traefik.http.services.res-chino.loadbalancer.server.port=80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenkong-backend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=http://localhost
      - JWT_SECRET=${JWT_SECRET:-greonkong-secret-change-in-production}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    env_file:
      - ./backend/.env
    networks:
      - traefik_public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.res-chino-api.rule=PathPrefix(`/res-chino/api`)"
      - "traefik.http.services.res-chino-api.loadbalancer.server.port=3001"

networks:
  traefik_public:
    external: true
