services:
  nginx:
    image: nginx:alpine
    container_name: greenkong-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - greenkong-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenkong-backend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=http://localhost:8080
      - JWT_SECRET=${JWT_SECRET:-greonkong-secret-change-in-production}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    env_file:
      - ./backend/.env
    networks:
      - greenkong-network
    restart: unless-stopped

networks:
  greenkong-network:
    driver: bridge
