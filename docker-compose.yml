services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3015:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=*
      - JWT_SECRET=${JWT_SECRET:-greonkong-secret-change-in-production}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.japones-api.rule=PathPrefix(`/japones/api`)"
      - "traefik.http.routers.japones-api.entrypoints=web"
      - "traefik.http.services.japones-api.loadbalancer.server.port=3001"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8093:80"
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.japones.rule=PathPrefix(`/japones`)"
      - "traefik.http.routers.japones.entrypoints=web"
      - "traefik.http.services.japones.loadbalancer.server.port=80"
