services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: res-greenkong-backend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=https://tudominio.com
      - JWT_SECRET=${JWT_SECRET:-greenkong-secret-change-in-production}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    env_file:
      - ./backend/.env
    networks:
      - web_proxy_network
    restart: unless-stopped

networks:
  web_proxy_network:
    external: true
